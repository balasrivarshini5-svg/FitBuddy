<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy - Your Fitness Partner</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 { color: #16a085; }
        p { font-size: 18px; line-height: 1.6; }
        .btn {
            display: inline-block;
            background-color: #e67e22;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn:hover { background-color: #d35400; }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #2c3e50;
            color: white;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        🏋️‍♂️ FitBuddy Dashboard
    </header>

    <div class="container">
        <h2>Welcome to Your FitBuddy Project!</h2>
        <p>This is a complete, responsive frontend layout for your fitness tracker project. You can track your daily workouts, meal plans, and fitness goals dynamically right here.</p>
        <a href="#" class="btn">Get Started Today</a>
    </div>

    <footer>
        &copy; 2026 FitBuddy Project | All Rights Reserved.
    </footer>

</body>
</html>
